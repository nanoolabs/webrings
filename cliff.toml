[changelog]
header = """
# Nanoo Webrings Changelog

All notable changes to nanoo-webrings will be documented here.
"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/nanoolabs/webrings/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""

footer = """
***
*Generated automatically.*
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^chore", group = "Maintenance" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = ".*", group = "Other" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
